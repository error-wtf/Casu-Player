name: V7 iOS package
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Resolve product version
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
      - run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Package device and simulator
        working-directory: src/ios
        run: |
          set -euo pipefail
          xcodegen generate
          mkdir -p ../../dist/ios
          xcodebuild archive -project MPCASU.xcodeproj -scheme MPCASU -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "../../dist/ios/MPCASU-iOS-$VERSION.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          xcodebuild build -project MPCASU.xcodeproj -scheme MPCASU -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ../../.v7-ios-simulator CODE_SIGNING_ALLOWED=NO
          app="../../dist/ios/MPCASU-iOS-$VERSION.xcarchive/Products/Applications/MPCASU.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = "$VERSION"
          ditto -c -k --keepParent "$app" "../../dist/ios/MPCASU-iOS-Device-Unsigned-$VERSION.zip"
          ditto -c -k --keepParent "../../dist/ios/MPCASU-iOS-$VERSION.xcarchive" "../../dist/ios/MPCASU-iOS-Archive-$VERSION.zip"
          ditto -c -k --keepParent ../../.v7-ios-simulator/Build/Products/Debug-iphonesimulator/MPCASU.app "../../dist/ios/MPCASU-iOS-Simulator-$VERSION.zip"
          mkdir -p ../../dist/ios/Payload
          ditto "$app" ../../dist/ios/Payload/MPCASU.app
          cd ../../dist/ios
          ditto -c -k --keepParent Payload "MPCASU-iOS-$VERSION.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: v7-ios-package
          path: |
            dist/ios/*.zip
            dist/ios/*.ipa
          if-no-files-found: error
      - name: Replace v7 iOS assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "dist/ios/MPCASU-iOS-$VERSION.ipa" "dist/ios/MPCASU-Player-iOS-$VERSION.ipa"
          gh release upload "v$VERSION" "dist/ios/MPCASU-Player-iOS-$VERSION.ipa" --clobber
