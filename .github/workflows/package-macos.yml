name: Build macOS Player
# v7.8: Produkt-Version kommt zentral aus der VERSION-Datei im Repo-Root
# (einzige Quelle; parallel zu packaging/linux/build-player-deb.sh & player-only.nsi).

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve product version
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
      - name: Prepare existing player runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Legacy-Donor: Run 33866510343 enthält das historische 7.0.0-Runtime-Zip
          # (VLC/FFmpeg-Frameworks). Dateiname ist an den Alt-Run gebunden, daher
          # per Glob statt hartkodierter Version auflösen.
          gh run download 33866510343 --repo error-wtf/Casu-Player \
            --name mpcasu-player-macos --dir "$RUNNER_TEMP/previous"
          legacy_zip="$(find "$RUNNER_TEMP/previous" -name 'MPCASU-Player-macOS-*.zip' -print -quit)"
          test -n "$legacy_zip"
          ditto -x -k "$legacy_zip" "$RUNNER_TEMP/previous-app"
      - name: Build current MPCASU desktop player
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          python -m pip install --disable-pip-version-check \
            'PySide6==6.10.2' python-vlc pyinstaller numpy zstd yt-dlp pytest
          QT_QPA_PLATFORM=offscreen python -m pytest -q tests/test_inapp_browser.py tests/test_youtube_playlist_groups.py
          python -m PyInstaller --noconfirm --clean --windowed \
            --name 'MPCASU Player' --paths src/desktop \
            --add-data 'src/windows/assets:assets' src/desktop/mpcasu_qt/app.py
          app='dist/MPCASU Player.app'
          donor="$(find "$RUNNER_TEMP/previous-app" -type d \
            -name 'MPCASU Player.app' -print -quit)"
          test -d "$app"
          test -d "$donor"
          mkdir -p "$app/Contents/Frameworks" "$app/Contents/Helpers"
          test ! -d "$donor/Contents/Frameworks/VLC" || \
            ditto "$donor/Contents/Frameworks/VLC" "$app/Contents/Frameworks/VLC"
          test ! -d "$donor/Contents/Frameworks/FFmpeg" || \
            ditto "$donor/Contents/Frameworks/FFmpeg" "$app/Contents/Frameworks/FFmpeg"
          test ! -d "$donor/Contents/Helpers" || \
            ditto "$donor/Contents/Helpers" "$app/Contents/Helpers"
          resources="$app/Contents/Resources"
          mkdir -p "$resources/THIRD_PARTY_LICENSES"
          ditto LICENSE "$resources/LICENSE.txt"
          ditto DISCLAIMER.md "$resources/DISCLAIMER.md"
          ditto THIRD_PARTY_COMPONENTS.md "$resources/THIRD_PARTY_COMPONENTS.md"
          test ! -s THIRD_PARTY_SOURCE_OFFER.md || \
            ditto THIRD_PARTY_SOURCE_OFFER.md "$resources/THIRD_PARTY_SOURCE_OFFER.md"
          ditto THIRD_PARTY_LICENSES "$resources/THIRD_PARTY_LICENSES"
          test ! -e "$app/Contents/MacOS/CASU-Converter"
          test ! -e "$app/Contents/MacOS/casu"
          test ! -e "$app/Contents/MacOS/CASU-Web-Backend"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage"
          ditto "$app" "$stage/MPCASU Player.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -quiet -volname "MPCASU Player $VERSION" \
            -srcfolder "$stage" -ov -format UDZO \
            "dist/MPCASU-Player-macOS-$VERSION.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: mpcasu-player-macos
          path: dist/MPCASU-Player-macOS-${{ env.VERSION }}.dmg
          if-no-files-found: error

  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Resolve product version
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
      - run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate native iOS project
        working-directory: src/ios
        run: xcodegen generate
      - name: Build and archive real iOS device target
        working-directory: src/ios
        run: |
          set -euo pipefail
          mkdir -p ../../dist/apple
          xcodebuild build \
            -project MPCASU.xcodeproj \
            -scheme MPCASU \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../../.v7-derived-data/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          xcodebuild archive \
            -project MPCASU.xcodeproj \
            -scheme MPCASU \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "../../dist/apple/MPCASU-iOS-$VERSION.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          app="../../dist/apple/MPCASU-iOS-$VERSION.xcarchive/Products/Applications/MPCASU.app"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = org.casu.mpcasu
          file "$app/MPCASU" | grep -q arm64
          ditto -c -k --keepParent "$app" "../../dist/apple/MPCASU-iOS-Device-Unsigned-$VERSION.zip"
          ditto -c -k --keepParent "../../dist/apple/MPCASU-iOS-$VERSION.xcarchive" "../../dist/apple/MPCASU-iOS-Archive-$VERSION.zip"
          shasum -a 256 "../../dist/apple/MPCASU-iOS-Device-Unsigned-$VERSION.zip" > "../../dist/apple/MPCASU-iOS-Device-Unsigned-$VERSION.zip.sha256"
          shasum -a 256 "../../dist/apple/MPCASU-iOS-Archive-$VERSION.zip" > "../../dist/apple/MPCASU-iOS-Archive-$VERSION.zip.sha256"
      - name: Select representative simulators
        id: sims
        run: |
          set -euo pipefail
          runtime="$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.isAvailable and (.identifier | contains(".iOS-")))] | sort_by(.version | split(".") | map(tonumber)) | last.identifier')"
          test -n "$runtime"; test "$runtime" != null
          devices="$(xcrun simctl list devices available -j)"
          phone_template="$(jq -r --arg runtime "$runtime" '[.devices[$runtime][] | select(.isAvailable and (.name | startswith("iPhone")))] | last.udid' <<<"$devices")"
          tablet_template="$(jq -r --arg runtime "$runtime" '[.devices[$runtime][] | select(.isAvailable and (.name | startswith("iPad")))] | last.udid' <<<"$devices")"
          test -n "$phone_template"; test "$phone_template" != null
          test -n "$tablet_template"; test "$tablet_template" != null
          phone="$(xcrun simctl clone "$phone_template" MPCASU-V7-iPhone)"
          tablet="$(xcrun simctl clone "$tablet_template" MPCASU-V7-iPad)"
          echo "phone=$phone" >> "$GITHUB_OUTPUT"
          echo "tablet=$tablet" >> "$GITHUB_OUTPUT"
      - name: Build and test iPhone simulator
        working-directory: src/ios
        run: |
          xcrun simctl boot '${{ steps.sims.outputs.phone }}'
          xcrun simctl bootstatus '${{ steps.sims.outputs.phone }}' -b
          xcodebuild test -project MPCASU.xcodeproj -scheme MPCASU -configuration Debug -sdk iphonesimulator -destination 'platform=iOS Simulator,id=${{ steps.sims.outputs.phone }}' -derivedDataPath ../../.v7-derived-data/iphone -resultBundlePath ../../dist/src/ios-iphone.xcresult CODE_SIGNING_ALLOWED=NO
          xcrun simctl shutdown '${{ steps.sims.outputs.phone }}'
      - name: Build and test iPad simulator
        working-directory: src/ios
        run: |
          xcrun simctl boot '${{ steps.sims.outputs.tablet }}'
          xcrun simctl bootstatus '${{ steps.sims.outputs.tablet }}' -b
          xcodebuild test -project MPCASU.xcodeproj -scheme MPCASU -configuration Debug -sdk iphonesimulator -destination 'platform=iOS Simulator,id=${{ steps.sims.outputs.tablet }}' -derivedDataPath ../../.v7-derived-data/ipad -resultBundlePath ../../dist/src/ios-ipad.xcresult CODE_SIGNING_ALLOWED=NO
          xcrun simctl shutdown '${{ steps.sims.outputs.tablet }}'
      - name: Package simulator application
        run: |
          mkdir -p dist/apple
          ditto -c -k --keepParent .v7-derived-data/iphone/Build/Products/Debug-iphonesimulator/MPCASU.app "dist/apple/MPCASU-iOS-Simulator-$VERSION.zip"
          shasum -a 256 "dist/apple/MPCASU-iOS-Simulator-$VERSION.zip" > "dist/apple/MPCASU-iOS-Simulator-$VERSION.zip.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mpcasu-player-ios
          path: dist/apple/
          if-no-files-found: error
