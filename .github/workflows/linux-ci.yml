# Linux-CI für den Player: pytest-Suite (31 Tests, läuft dank tests/conftest.py
# ohne PYTHONPATH) + deterministischer Deb-Build inkl. F1-Gate
# (_LockedConnection muss im ausgelieferten casu/library.py enthalten sein —
# das Release-Deb 7.0.0 hatte genau diesen Regression, F1).
name: Linux CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check \
            pytest PySide6 python-vlc
      - name: Install Qt offscreen runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 xvfb
      # Kein PYTHONPATH nötig: tests/conftest.py setzt src/desktop auf sys.path.
      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  debian-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build player deb (version from VERSION file, reproducible)
        run: ./packaging/linux/build-player-deb.sh
      - name: Smoke-check deb + F1 gate
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          deb="dist/mpcasu-player_${VERSION}_all.deb"
          test -s "$deb"
          dpkg-deb -I "$deb" | grep -E 'Package|Version'
          dpkg-deb -c "$deb" >/dev/null
          # F1-Gate: die ausgelieferte library.py muss die _LockedConnection-
          # Härtung enthalten (2 Vorkommen — Release 7.0.0 hatte 0).
          extract="$(mktemp -d)"
          dpkg-deb -x "$deb" "$extract"
          count="$(grep -c _LockedConnection "$extract/usr/share/mpcasu-player/casu/library.py")"
          echo "_LockedConnection count: $count"
          test "$count" -eq 2
